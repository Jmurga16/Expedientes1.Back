# Los valores se leen de variables de entorno.
#  - Local: archivo .env en la raiz del proyecto (ver .env.example)
#  - Azure App Service: Configuration > Application settings
spring.config.import=optional:file:.env[.properties]

# mongodb
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:db_expedientes}

# security
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000}

# cors (origenes del front separados por coma)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://gestor-expedientesv1.azurewebsites.net}

# blob storage
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME}
azure.storage.account-key=${AZURE_STORAGE_ACCOUNT_KEY}

# uploads (FileService valida ademas 5 MB por archivo)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
